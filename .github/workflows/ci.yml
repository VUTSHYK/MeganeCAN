name: WeAct ESP32-C5 CI

# Exactly one job per push. Run checks sequentially so GitHub displays
# a single job, rather than one job per matrix environment.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: meganecan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build WeAct ESP32-C5
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-unified-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Stub local-only secrets.h
        run: |
          if [ ! -f src/secrets.h ]; then
            printf '#pragma once\n#define Soft_AP_WIFI_SSID "MeganeCAN-CI"\n#define Soft_AP_WIFI_PASS "ci-build-only"\n' > src/secrets.h
          fi
      - name: Native unit tests
        id: native
        continue-on-error: true
        run: pio test -e native
      - name: Build WeAct ESP32-C5 passive
        id: c5
        continue-on-error: true
        run: pio run -e weact-esp32c5-passive
      - name: Upload ESP32-C5 firmware
        if: steps.c5.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: weact-esp32c5-passive
          path: |
            .pio/build/weact-esp32c5-passive/firmware.factory.bin
            .pio/build/weact-esp32c5-passive/firmware.bin
            .pio/build/weact-esp32c5-passive/bootloader.bin
            .pio/build/weact-esp32c5-passive/partitions.bin
          if-no-files-found: warn
      - name: Final result
        if: always()
        env:
          NATIVE: ${{ steps.native.outcome }}
          C5: ${{ steps.c5.outcome }}
        run: |
          echo "native=$NATIVE esp32c5=$C5"
          if [ "$NATIVE" != success ] || [ "$C5" != success ]; then
            exit 1
          fi
